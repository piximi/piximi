name: Test

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.2.2
          runtime: node@22
          cache: true

      - name: Install Packages
        # @tensorflow/tfjs-node canvas core-js esbuild
        run: pnpm install --dangerously-allow-all-builds

      - name: Lint code
        run: |
          pnpm run format-check
          pnpm run lint

      - name: Run Tests
        run: pnpm test  --silent
        env:
          CI: true

  # The wire contract lives in python/packages/piximi-schema; the bundle and
  # the TypeScript generated from it are checked in and must not drift.
  protocol_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.2.2
          runtime: node@22
          cache: true

      - name: Install Packages
        run: pnpm install --dangerously-allow-all-builds

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: python

      - name: Python tests
        run: uv run --project python pytest -q

      - name: Regenerate protocol
        run: pnpm protocol:gen

      - name: Check for drift
        run: git diff --exit-code -- python/packages/piximi-schema/schema src/core/backend/protocol

      # The TypeScript peer against the Python one over a real WebSocket.
      - name: Cross-language RPC tests
        run: pnpm test --run src/core/backend/remote
        env:
          PIXIMI_REMOTE_TEST: "1"
