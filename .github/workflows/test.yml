name: Test

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Install Packages
        # @tensorflow/tfjs-node canvas core-js esbuild
        run: pnpm install --dangerously-allow-all-builds

      - name: Lint code
        run: |
          pnpm run format-check
          pnpm run lint

      - name: Run Tests
        run: pnpm test --exclude e2e/ --silent
        env:
          CI: true
