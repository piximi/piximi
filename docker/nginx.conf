# NOTE: Mirrors GitHub Pages serving by having any unknown path falls through to
# 404.html, whose spa-github-pages script bounces deep links back through
# index.html.
# See comments in index.html and public/404.html.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # NOTE: .wasm is already mapped in nginx's bundled mime.types, which the main
    # nginx.conf includes before this file.
    # Default mime.types don't map .mjs, so the ORT sidecars under /ort/ would go
    # out as application/octet-stream and the browser would refuse to execute
    # them as modules, breaking onnxruntime-web's dynamic import. Empty `types`
    # plus `default_type` overrides just this location, leaving the global map
    # intact.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    error_page 404 /404.html;
}
