[project]
name = "piximi-workspace"
version = "0.0.0"
description = "uv workspace for Piximi's Python packages (schema, link, engine)."
requires-python = ">=3.12"
dependencies = ["piximi-schema"]

[tool.uv]
package = false

[tool.uv.sources]
piximi-schema = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["packages"]
