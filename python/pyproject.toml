[project]
name = "piximi-workspace"
version = "0.0.0"
description = "uv workspace for Piximi's Python packages (schema, link, engine, model SDK, app)."
requires-python = ">=3.12"
dependencies = ["piximi-schema", "piximi-link", "piximi-engine", "piximi-model-sdk", "piximi"]

[tool.uv]
package = false

[tool.uv.sources]
piximi-schema = { workspace = true }
piximi-link = { workspace = true }
piximi-engine = { workspace = true }
piximi-model-sdk = { workspace = true }
piximi = { workspace = true }
# iroh publishes no wheel for Intel Macs, so build the same release from
# source there (needs a Rust toolchain); everywhere else it comes from PyPI.
iroh = { git = "https://github.com/n0-computer/iroh-ffi", tag = "v1.2.0", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" }
# Unreleased: PyPI has 0.12.0, without the worker handshake, shutdown and
# shared-memory helpers the engine's plugin runner relies on. Plugin
# environments get this same pin, since a worker must match the minor.
appose = { git = "https://github.com/apposed/appose-python", rev = "5f5a1b1101e7ca6679f0eee0dc172f92fb84c654" }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.27", "cellcast>=0.3", "appose", "piximi-link[iroh]"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
