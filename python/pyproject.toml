[project]
name = "piximi-workspace"
version = "0.0.0"
description = "uv workspace for Piximi's Python packages (schema, link, engine)."
requires-python = ">=3.12"
dependencies = ["piximi-schema", "piximi-link", "piximi-engine"]

[tool.uv]
package = false

[tool.uv.sources]
piximi-schema = { workspace = true }
piximi-link = { workspace = true }
piximi-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.27", "cellcast>=0.3"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
