[project]
name = "piximi-engine"
version = "0.1.0"
description = "The reference Piximi backend engine: project storage (SQLite + zarr), image decoding, compositing, measurements and a segmentation model registry, served to the frontend through piximi-link."
requires-python = ">=3.12"
dependencies = [
  "piximi-schema",
  "piximi-link",
  "piximi-model-sdk",
  "numpy>=1.26",
  "zarr>=3.0",
  "tifffile>=2024.2",
  "imageio>=2.34",
  "pillow>=10",
  "scikit-image>=0.24",
  "scipy>=1.12",
]

[project.optional-dependencies]
# StarDist2D in this process, for an engine without plugin environments.
cellcast = ["cellcast>=0.3"]
# Model plugins in their own environments (see piximi_engine.models.plugin).
appose = ["appose"]

[project.scripts]
piximi = "piximi_engine.cli:main"

# A "Piximi" tile in the JupyterLab launcher when jupyter-server-proxy is installed.
[project.entry-points.jupyter_serverproxy_servers]
piximi = "piximi_engine.jupyter:setup_piximi"

# Model plugins the engine ships; each value is its manifest's path.
[project.entry-points."piximi.models"]
cellcast = "piximi_engine.plugins:CELLCAST"
cellpose = "piximi_engine.plugins:CELLPOSE"
torch-cnn = "piximi_engine.plugins:TORCH_CNN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piximi_engine"]
# The frontend build `pnpm engine:frontend` copies in is gitignored, which
# hatch would otherwise honour; ship it when present.
artifacts = ["src/piximi_engine/frontend/"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/piximi_engine/frontend/"]

[tool.uv.sources]
piximi-schema = { workspace = true }
piximi-link = { workspace = true }
piximi-model-sdk = { workspace = true }
