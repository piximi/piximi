[project]
name = "piximi-engine"
version = "0.1.0"
description = "The reference Piximi backend engine: project storage (SQLite + zarr), image decoding, compositing, measurements and a segmentation model registry, served to the frontend through piximi-link."
requires-python = ">=3.12"
dependencies = [
  "piximi-schema",
  "piximi-link",
  "numpy>=1.26",
  "zarr>=3.0",
  "tifffile>=2024.2",
  "imageio>=2.34",
  "pillow>=10",
  "scikit-image>=0.24",
  "scipy>=1.12",
]

[project.optional-dependencies]
cellcast = ["cellcast>=0.3"]

[project.scripts]
piximi = "piximi_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piximi_engine"]

[tool.uv.sources]
piximi-schema = { workspace = true }
piximi-link = { workspace = true }
