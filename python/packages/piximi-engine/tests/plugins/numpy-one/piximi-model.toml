# A fixture plugin: a threshold on an old numpy, to prove two plugins with
# conflicting requirements run side by side.
[plugin]
id = "numpy-one"
name = "Threshold on numpy 1"
version = "1.0"
framework = "numpy"
entry = "model.py"

[plugin.env]
python = "3.12"
requirements = ["numpy<2"]

[[models]]
id = "threshold-numpy-one"
attribute = "MODEL"
display_name = "Threshold (numpy 1)"
description = "Labels bright squares, in a kind named after the worker's numpy major version"
use = "Tests"
output = { mode = "classes", kind_names = ["numpy1", "numpy2"] }
channels = { mode = "passthrough", max_channels = 1 }

[[models.options.groups]]
id = "test"
label = "Test"
fields = [
  { key = "threshold", type = "number", label = "Level", default = 100 },
  { key = "delay", type = "number", label = "Seconds per row", default = 0, advanced = true },
]
