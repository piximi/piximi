[project]
name = "piximi-link"
version = "0.1.0"
description = "Transport and RPC layer between the Piximi frontend and a backend engine: msgpack framing, a symmetric JSON-RPC peer, and WebSocket transports."
requires-python = ">=3.12"
dependencies = ["piximi-schema", "msgpack>=1.1", "websockets>=14"]

[project.scripts]
piximi-link-echo = "piximi_link.testing.echo_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piximi_link"]

[tool.uv.sources]
piximi-schema = { workspace = true }
