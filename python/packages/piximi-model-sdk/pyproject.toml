[project]
name = "piximi-model-sdk"
version = "0.1.0"
description = "What a Piximi model plugin implements: a small base class and context, with no dependency on the engine, installed inside each plugin's own environment."
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piximi_model_sdk"]
