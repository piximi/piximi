[project]
name = "piximi-schema"
version = "0.1.0"
description = "The Piximi frontend <-> backend wire contract: Pydantic models and the JSON Schema bundle generated from them."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[project.scripts]
piximi-schema-export = "piximi_schema.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piximi_schema"]
